<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      let appearance = "system";
      try {
        appearance = localStorage.getItem("lazuli-theme") || "system";
      } catch {}
      const dark =
        appearance === "dark" ||
        (appearance !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.classList.toggle("dark", dark);
      document.documentElement.style.colorScheme = dark ? "dark" : "light";
    </script>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta
      name="description"
      content="Organize seus materiais de estudo, crie flashcards e quizzes com ajuda da IA e revise o que aprendeu no Lazúli."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Lazúli" />
    <meta property="og:title" content="Lazúli — organize seus estudos, aprenda praticando" />
    <meta
      property="og:description"
      content="Reúna seus materiais, crie flashcards e quizzes com IA e saiba o que revisar a seguir."
    />
    <meta property="og:image" content="https://lazuli.brunoaseff.com.br/social-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Lazúli. Organize seus estudos. Aprenda praticando." />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Lazúli — organize seus estudos, aprenda praticando</title>
  </head>

      <main>

      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>

</html>
