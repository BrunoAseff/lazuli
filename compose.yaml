services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lazuli
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lazuli"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - lazuli-postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lazuli
      MINIO_ROOT_PASSWORD: lazuli-local-secret
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - lazuli-minio-data:/data

volumes:
  lazuli-postgres-data:
  lazuli-minio-data:
