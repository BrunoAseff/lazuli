services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lazuli
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lazuli"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - lazuli-postgres-data:/var/lib/postgresql/data

volumes:
  lazuli-postgres-data:
